services:
  api:
    build: .
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - seccomp=./seccomp_profile.json
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
